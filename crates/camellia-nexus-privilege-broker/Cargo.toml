[package]
name = "camellia-nexus-privilege-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Minimal privilege-boundary broker for Camellia Nexus-managed processes"
rust-version.workspace = true
publish = false

[[bin]]
name = "camellia-nexus-privilege-broker"
path = "src/main.rs"

[dependencies]
camellia-nexus-core = { path = "../camellia-nexus-core" }
libc.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
