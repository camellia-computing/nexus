overrides:
  # @rolldown/binding-wasm32-wasi 1.1.5 pins the stable 1.x emnapi pair.
  # wasm-runtime 1.2.0 requires the incompatible 2.0 alpha pair.
  '@napi-rs/wasm-runtime': 1.1.6
  '@wdio/native-utils': 2.5.0
  brace-expansion: 5.0.12
  '@puppeteer/browsers': 3.2.0
  deepmerge-ts: 8.0.1
  nanoid: 3.3.18
  serialize-javascript: 7.0.7

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

patchedDependencies:
  # WebdriverIO's minimatch consumers require callable/default exports.
  # The module-surface patch preserves the upstream expansion limits.
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
