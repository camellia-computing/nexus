overrides:
  # @rolldown/binding-wasm32-wasi 1.1.5 pins the stable 1.x emnapi pair.
  # wasm-runtime 1.2.0 requires the incompatible 2.0 alpha pair.
  '@napi-rs/wasm-runtime': 1.1.6
  brace-expansion: 5.0.12
  '@puppeteer/browsers': 3.2.6
  deepmerge-ts: 8.0.2
  nanoid: 3.3.18
  serialize-javascript: 7.1.3
  mocha: 11.8.0
  diff: 9.0.0

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

patchedDependencies:
  # Keep the callable/default module exports required by minimatch consumers.
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch

minimumReleaseAgeExclude:
  - serialize-javascript@7.1.3
  - '@puppeteer/browsers@3.2.6'
