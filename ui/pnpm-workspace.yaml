overrides:
  # @rolldown/binding-wasm32-wasi 1.1.5 pins the stable 1.x emnapi pair.
  # wasm-runtime 1.2.0 requires the incompatible 2.0 alpha pair.
  '@napi-rs/wasm-runtime': 1.1.6
  '@wdio/native-utils': 2.5.0
  brace-expansion: 5.0.8
  serialize-javascript: 7.0.7

allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false

patchedDependencies:
  # Temporary GHSA-mh99-v99m-4gvg bridge: the latest secure brace-expansion
  # crosses WebdriverIO's legacy minimatch module contract. Keep this exact
  # patch and its retirement conditions aligned with docs/dependency-management.md.
  brace-expansion@5.0.8: patches/brace-expansion@5.0.8.patch
